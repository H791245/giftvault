<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gift Vault">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Gift Card Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, private, quick — a wallet you open at the checkout.
   IDEA: a card sleeve — each gift card a coloured card in a stack, the photo inside.
   PICTURE: the stack of cards itself, colour taken from the shop name.
   COLOUR and TYPE: white / near-black ground, cards in shop hues, one coral accent; Manrope.
   LAYOUT: total on top, search, the card stack; sheet slides up for add/view. */
:root{color-scheme:light dark;--bg:light-dark(#f6f6f8,#111216);--panel:light-dark(#fff,#1b1c22);--ink:light-dark(#15161a,#f1f1f4);--mute:light-dark(#6b6d76,#9a9ca6);--line:light-dark(#e3e3e8,#2c2d35);--acc:#ff5a3c;--ok:#1f9d6b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:max(env(safe-area-inset-top),16px) max(env(safe-area-inset-right),16px) calc(env(safe-area-inset-bottom) + 110px) max(env(safe-area-inset-left),16px)}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 0 18px}
h1{font-size:32px;line-height:1.05;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:14px;margin-top:6px}
.total{text-align:right}.total b{display:block;font-size:clamp(28px,8vw,40px);line-height:1;font-weight:800;white-space:nowrap}.total span{font-size:13px;color:var(--mute)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin-bottom:12px;min-height:20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}.dot.on{background:var(--ok)}.dot.err{background:var(--acc)}
.tools{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tools input{flex:1 1 200px}.tools select{flex:0 0 auto;width:auto}
button{font:inherit;font-weight:600;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 16px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.ghost{background:none;border-color:transparent;color:var(--mute)}
button:disabled{opacity:.5}
.stack{display:grid;gap:12px}
.card{position:relative;border-radius:18px;color:#fff;padding:16px 18px;min-height:118px;display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:12px;cursor:pointer;border:0;text-align:left;width:100%;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 8px 20px -10px rgba(0,0,0,.45);overflow:hidden;transition:transform .15s}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
.card:active{transform:scale(.985)}
.card.used{filter:grayscale(.85);opacity:.6}
.card .shop{font-size:21px;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.card .amt{font-size:26px;font-weight:800;margin-top:10px;white-space:nowrap}
.card .meta{font-size:13px;opacity:.9;margin-top:4px}
.card .meta .warn{background:rgba(0,0,0,.28);padding:1px 7px;border-radius:99px}
.thumb{width:92px;height:86px;border-radius:10px;background:rgba(255,255,255,.18) center/cover no-repeat;align-self:center}
.empty{border:2px dashed var(--line);border-radius:18px;padding:36px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);height:56px;padding:0 28px;border-radius:99px;font-size:17px;box-shadow:0 10px 24px -8px rgba(255,90,60,.6);z-index:5}
.sheet{position:fixed;inset:0;z-index:10;display:none;background:rgba(0,0,0,.45)}
.sheet.open{display:flex;align-items:flex-end;justify-content:center}
.pane{background:var(--bg);width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(env(safe-area-inset-left),18px) calc(env(safe-area-inset-bottom) + 20px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.pane{animation:none}.card{transition:none}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.bar h2{font-size:22px;margin:0}
.photo{display:block;width:100%;aspect-ratio:1.6;border-radius:16px;background:var(--panel) center/contain no-repeat;border:1px dashed var(--line);display:grid;place-items:center;color:var(--mute);cursor:pointer;margin-bottom:14px;text-align:center;padding:10px}
.photo.has{border-style:solid;color:transparent}
.big{width:100%;border-radius:16px;display:block;background:var(--panel);min-height:160px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 5px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.acts button{flex:1 1 120px}
.kv{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:14px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.kv div:first-child{border-top:0}
.kv span{color:var(--mute);font-size:14px}.kv b{text-align:right;overflow-wrap:anywhere}
.code{font-size:20px;letter-spacing:.06em}
.err{color:var(--acc);font-size:14px;margin-top:10px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;display:none}
.small{font-size:13px;color:var(--mute)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Gift Card Vault</h1><div class="sub" id="count">Loading…</div></div>
    <div class="total"><b id="total">€0</b><span>unused balance</span></div>
  </header>
  <div class="status"><span class="dot" id="dot"></span><span id="stat">Connecting to Google Drive…</span><button class="ghost hide" id="out" style="margin-left:auto;min-height:32px">Sign out</button></div>
  <div class="empty hide" id="login"><b>Sign in to open your vault</b><p>Your cards are kept in the “Gift Card Vault” folder in your own Google Drive.</p><button class="pri" id="signin">Sign in with Google</button></div>
  <div id="app" class="hide">
  <div class="tools">
    <input id="q" type="search" placeholder="Search shop, code or note" autocomplete="off">
    <select id="filter" aria-label="Show"><option value="active">Unused</option><option value="used">Used up</option><option value="all">All cards</option></select>
    <button id="refresh" aria-label="Sync now">Sync</button>
  </div>
  <div class="stack" id="list"></div>
  </div>
</div>
<button class="pri fab hide" id="add">+ Add gift card</button>

<div class="sheet" id="edit"><div class="pane">
  <div class="bar"><h2 id="eTitle">New gift card</h2><button class="ghost" data-close>Close</button></div>
  <form id="form" autocomplete="off">
    <label class="photo" id="pick" for="file">Tap to take a photo or choose one</label>
    <input id="file" type="file" accept="image/*" class="hide">
    <label for="shop">Shop name *</label>
    <input id="shop" list="shops" required placeholder="e.g. Bol.com, IKEA, HEMA">
    <datalist id="shops"></datalist>
    <div class="row">
      <div><label for="amount">Balance (€)</label><input id="amount" inputmode="decimal" placeholder="25.00"></div>
      <div><label for="expiry">Expires</label><input id="expiry" type="date"></div>
    </div>
    <div class="row">
      <div><label for="code">Card number / code</label><input id="code" autocapitalize="characters"></div>
      <div><label for="pin">PIN</label><input id="pin" inputmode="numeric"></div>
    </div>
    <label for="notes">Notes</label><textarea id="notes" placeholder="From whom, where it works…"></textarea>
    <div class="err" id="fErr"></div>
    <div class="acts"><button type="submit" class="pri" id="save">Save to vault</button></div>
  </form>
</div></div>

<div class="sheet" id="view"><div class="pane">
  <div class="bar"><h2 id="vShop"></h2><button class="ghost" data-close>Close</button></div>
  <img class="big" id="vImg" alt="Gift card photo">
  <div class="kv" id="vKv"></div>
  <div class="acts">
    <button id="vCopy">Copy code</button>
    <button id="vUsed">Mark used up</button>
    <button id="vEdit">Edit</button>
    <button id="vDel">Delete</button>
  </div>
  <div class="acts hide" id="vConfirm"><span class="small" style="flex-basis:100%">Move this card to your Google Drive trash?</span><button id="vNo">Keep it</button><button class="pri" id="vYes">Delete</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
{
/* ===== Paste your Google OAuth Client ID here ===== */
const CLIENT_ID='959801178130-0ilckucq6uko4v2os4581g6pjcbri1s6.apps.googleusercontent.com';
/* ================================================== */
const SCOPE='https://www.googleapis.com/auth/drive.file', FOLDER_NAME='Gift Card Vault', API='https://www.googleapis.com/drive/v3', UP='https://www.googleapis.com/upload/drive/v3';
const FIELDS='id,name,description,modifiedTime,createdTime,webViewLink';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=null, folderId=null, cards=[], current=null, editing=null, newPhoto=null;
const imgs=new Map();
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function status(t,kind){$('stat').textContent=t;$('dot').className='dot '+(kind||'')}
const money=n=>'€'+(Number(n)||0).toLocaleString('nl-NL',{minimumFractionDigits:Number(n)%1?2:0,maximumFractionDigits:2});
function hue(s){let h=0;for(const c of s.toLowerCase())h=(h*31+c.charCodeAt(0))%360;return h}
function daysTo(d){if(!d)return null;return Math.ceil((new Date(d+'T23:59:59')-new Date())/864e5)}

/* ---- photo cache (IndexedDB) ---- */
let idbP=new Promise(res=>{try{const r=indexedDB.open('gcv',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
async function cacheGet(k){const db=await idbP;return new Promise(res=>{try{const q=db.transaction('img').objectStore('img').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})}
async function cachePut(k,v){const db=await idbP;try{db.transaction('img','readwrite').objectStore('img').put(v,k)}catch(e){}}

/* ---- Google sign-in (redirect, works in home-screen mode) ---- */
const redirectUri=location.origin+location.pathname;
function signIn(){
  if(!CLIENT_ID||CLIENT_ID.startsWith('PASTE')){status('Client ID missing — add it to index.html.','err');return}
  const st=Math.random().toString(36).slice(2);ls.set('gcv_state',st);
  const hint=ls.get('gcv_hint');
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:CLIENT_ID,redirect_uri:redirectUri,response_type:'token',scope:SCOPE,include_granted_scopes:'true',state:st,...(hint?{login_hint:hint}:{})});
}
function readRedirect(){
  if(!location.hash.includes('access_token')&&!location.hash.includes('error='))return;
  const p=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'',location.pathname);
  if(p.get('error')){status('Sign-in was cancelled.','err');return}
  if(p.get('state')!==ls.get('gcv_state')){status('Sign-in check failed — try again.','err');return}
  ls.set('gcv_tok',{t:p.get('access_token'),exp:Date.now()+(+p.get('expires_in')||3600)*1000-60000});
}
function needLogin(msg){token=null;ls.del('gcv_tok');$('login').classList.remove('hide');$('app').classList.add('hide');$('add').classList.add('hide');$('out').classList.add('hide');status(msg||'Not signed in.')}
$('signin').onclick=signIn;
$('out').onclick=()=>{if(token)fetch('https://oauth2.googleapis.com/revoke?token='+token,{method:'POST'}).catch(()=>{});ls.del('gcv_hint');needLogin('Signed out.')};

/* ---- Drive REST ---- */
async function g(url,opts={}){
  if(!token)throw Object.assign(new Error('signed out'),{auth:true});
  const r=await fetch(url,{...opts,headers:{Authorization:'Bearer '+token,...(opts.headers||{})}});
  if(r.status===401){needLogin('Your session ended — sign in again.');throw Object.assign(new Error('session ended'),{auth:true})}
  if(!r.ok){let m=r.status;try{m=(await r.json()).error.message}catch(e){}throw new Error(m)}
  return opts.blob?r.blob():r.status===204?null:r.json();
}
const q=s=>encodeURIComponent(s);
async function ensureFolder(){
  const r=await g(`${API}/files?q=${q(`name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id)`);
  if(r.files&&r.files[0])return r.files[0].id;
  return (await g(`${API}/files?fields=id`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:FOLDER_NAME,mimeType:'application/vnd.google-apps.folder'})})).id;
}
function multipart(meta,blob){const b='gcv'+Math.random().toString(36).slice(2);return {headers:{'Content-Type':'multipart/related; boundary='+b},body:new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: image/jpeg\r\n\r\n`,blob,`\r\n--${b}--`])}}
function parseMeta(f){let m={};try{m=JSON.parse(f.description||'{}')}catch(e){}return {id:f.id,modified:f.modifiedTime,created:f.createdTime,url:f.webViewLink,shop:m.shop||f.name.replace(/\s*[—-]\s*\d{4}.*$/,'').replace(/\.\w+$/,''),amount:m.amount??'',code:m.code||'',pin:m.pin||'',expiry:m.expiry||'',notes:m.notes||'',used:!!m.used}}
async function load(){
  status('Syncing with Google Drive…');$('refresh').disabled=true;
  try{
    if(!folderId)folderId=await ensureFolder();
    let all=[],pt='';
    do{const r=await g(`${API}/files?q=${q(`'${folderId}' in parents and trashed=false and mimeType contains 'image/'`)}&pageSize=200&fields=nextPageToken,files(${FIELDS})${pt?'&pageToken='+pt:''}`);all=all.concat(r.files||[]);pt=r.nextPageToken}while(pt);
    cards=all.map(parseMeta);
    status('Synced with Google Drive · '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}),'on');
  }catch(e){if(!e.auth)status('Could not reach Google Drive ('+e.message+'). Tap Sync to retry.','err')}
  $('refresh').disabled=false;render();
}
async function photo(c){
  const key=c.id+'@'+c.modified;
  if(imgs.has(key))return imgs.get(key);
  let blob=await cacheGet(key);
  if(!blob){blob=await g(`${API}/files/${c.id}?alt=media`,{blob:true});cachePut(key,blob)}
  const u=URL.createObjectURL(blob);imgs.set(key,u);return u;
}

/* ---- list ---- */
function render(){
  const qq=$('q').value.trim().toLowerCase(),fl=$('filter').value;
  const act=cards.filter(c=>!c.used);
  $('total').textContent=money(act.reduce((s,c)=>s+(parseFloat(String(c.amount).replace(',','.'))||0),0));
  $('count').textContent=act.length+' unused card'+(act.length===1?'':'s')+(cards.length>act.length?' · '+(cards.length-act.length)+' used':'');
  $('shops').innerHTML=[...new Set(cards.map(c=>c.shop))].sort().map(s=>`<option value="${esc(s)}">`).join('');
  let list=cards.filter(c=>fl==='all'||(fl==='used'?c.used:!c.used)).filter(c=>!qq||[c.shop,c.code,c.notes].join(' ').toLowerCase().includes(qq));
  list.sort((a,b)=>a.shop.localeCompare(b.shop)||(a.expiry||'9').localeCompare(b.expiry||'9'));
  if(!list.length){$('list').innerHTML=`<div class="empty"><b>${cards.length?'Nothing matches':'Your vault is empty'}</b>${cards.length?'Try another search or filter.':'Tap “Add gift card”, snap a photo and give it a shop name. It is saved straight to the “Gift Card Vault” folder in your Google Drive.'}</div>`;return}
  $('list').innerHTML=list.map(c=>{
    const h=hue(c.shop),d=daysTo(c.expiry);
    const exp=c.expiry?(d<0?'<span class="warn">Expired</span>':d<=30?`<span class="warn">Expires in ${d} day${d===1?'':'s'}</span>`:'Valid until '+new Date(c.expiry).toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'})):'';
    return `<button class="card${c.used?' used':''}" data-id="${c.id}" style="background:linear-gradient(140deg,hsl(${h} 62% 44%),hsl(${(h+28)%360} 58% 30%))">
      <div><div class="shop">${esc(c.shop)}</div><div class="amt">${c.amount!==''?money(String(c.amount).replace(',','.')):'—'}</div><div class="meta">${c.used?'Used up':exp||(c.code?'•••• '+esc(c.code.slice(-4)):'&nbsp;')}</div></div>
      <div class="thumb" data-thumb="${c.id}"></div></button>`}).join('');
  loadThumbs(list);
}
async function loadThumbs(list){for(const c of list){const el=document.querySelector(`[data-thumb="${c.id}"]`);if(!el)continue;try{const u=await photo(c);el.style.backgroundImage=`url("${u}")`}catch(e){}}}

/* ---- sheets ---- */
function open(id){$(id).classList.add('open')}
function close(){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));$('vConfirm').classList.add('hide')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
document.querySelectorAll('.sheet').forEach(s=>s.onclick=e=>{if(e.target===s)close()});

function openEdit(c){
  editing=c||null;newPhoto=null;$('fErr').textContent='';
  $('eTitle').textContent=c?'Edit card':'New gift card';
  for(const k of ['shop','amount','expiry','code','pin','notes'])$(k).value=c?c[k]:'';
  const p=$('pick');p.classList.toggle('has',!!c);p.style.backgroundImage='';p.textContent=c?'Tap to replace photo':'Tap to take a photo or choose one';
  if(c)photo(c).then(u=>p.style.backgroundImage=`url("${u}")`).catch(()=>{});
  $('save').textContent=c?'Save changes':'Save to vault';
  close();open('edit');
}
$('add').onclick=()=>openEdit(null);
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{newPhoto=await shrink(f);const p=$('pick');p.style.backgroundImage=`url("${URL.createObjectURL(newPhoto)}")`;p.classList.add('has');p.textContent='Tap to replace photo'}
  catch(err){$('fErr').textContent='Could not read that photo — try another.'}
  e.target.value='';
};
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(),'image/jpeg',.82)};img.onerror=rej;img.src=u})}
const metaOf=(v,used)=>JSON.stringify({shop:v.shop,amount:v.amount,expiry:v.expiry,code:v.code,pin:v.pin,notes:v.notes,used,app:'gift-card-vault'});

$('form').onsubmit=async e=>{
  e.preventDefault();
  const v={};for(const k of ['shop','amount','expiry','code','pin','notes'])v[k]=$(k).value.trim();
  if(!v.shop){$('fErr').textContent='Give the card a shop name.';return}
  if(!editing&&!newPhoto){$('fErr').textContent='Add a photo of the card first.';return}
  const name=v.shop+' — '+((editing&&editing.created)||new Date().toISOString()).slice(0,10)+'.jpg';
  const meta={name,description:metaOf(v,editing?editing.used:false)};
  $('save').disabled=true;$('save').textContent='Saving to Drive…';$('fErr').textContent='';
  try{
    if(!folderId)folderId=await ensureFolder();
    let f;
    if(!editing){const m=multipart({...meta,parents:[folderId]},newPhoto);f=await g(`${UP}/files?uploadType=multipart&fields=${FIELDS}`,{method:'POST',...m})}
    else if(newPhoto){const m=multipart(meta,newPhoto);f=await g(`${UP}/files/${editing.id}?uploadType=multipart&fields=${FIELDS}`,{method:'PATCH',...m})}
    else f=await g(`${API}/files/${editing.id}?fields=${FIELDS}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(meta)});
    const c=parseMeta(f);
    if(newPhoto){cachePut(c.id+'@'+c.modified,newPhoto);imgs.set(c.id+'@'+c.modified,URL.createObjectURL(newPhoto))}
    else{const old=imgs.get(editing.id+'@'+editing.modified);if(old)imgs.set(c.id+'@'+c.modified,old)}
    cards=cards.filter(x=>x.id!==c.id).concat(c);
    close();render();toast(editing?'Card updated':'Saved to Google Drive');
  }catch(err){$('fErr').textContent=err.auth?'Sign in again, then save.':'Could not save: '+err.message}
  $('save').disabled=false;$('save').textContent=editing?'Save changes':'Save to vault';
};

$('list').onclick=e=>{const b=e.target.closest('.card');if(b)openView(cards.find(c=>c.id===b.dataset.id))};
function openView(c){
  current=c;$('vShop').textContent=c.shop;$('vImg').removeAttribute('src');
  photo(c).then(u=>{if(current===c)$('vImg').src=u}).catch(()=>{});
  const rows=[['Balance',c.amount!==''?money(String(c.amount).replace(',','.')):'—'],['Card number',c.code?`<span class="code">${esc(c.code)}</span>`:'—'],['PIN',c.pin?esc(c.pin):'—'],['Expires',c.expiry?new Date(c.expiry).toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'}):'—'],['Status',c.used?'Used up':'Unused']];
  if(c.notes)rows.push(['Notes',esc(c.notes)]);
  if(c.url)rows.push(['In Drive',`<a href="${esc(c.url)}" target="_blank" rel="noopener">Open photo</a>`]);
  $('vKv').innerHTML=rows.map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('');
  $('vCopy').disabled=!c.code;$('vUsed').textContent=c.used?'Mark unused':'Mark used up';
  open('view');
}
$('vCopy').onclick=async()=>{try{await navigator.clipboard.writeText(current.code);toast('Code copied')}catch(e){toast('Press and hold the number to copy')}};
$('vEdit').onclick=()=>openEdit(current);
$('vUsed').onclick=async()=>{
  const c=current,b=$('vUsed');b.disabled=true;
  try{const f=await g(`${API}/files/${c.id}?fields=${FIELDS}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:metaOf(c,!c.used)})});
    const n=parseMeta(f);const old=imgs.get(c.id+'@'+c.modified);if(old)imgs.set(n.id+'@'+n.modified,old);
    cards=cards.map(x=>x.id===c.id?n:x);render();openView(n);toast(n.used?'Marked as used up':'Marked as unused')}
  catch(e){toast('Could not update — try again')}
  b.disabled=false;
};
$('vDel').onclick=()=>$('vConfirm').classList.remove('hide');
$('vNo').onclick=()=>$('vConfirm').classList.add('hide');
$('vYes').onclick=async()=>{const c=current;$('vYes').disabled=true;try{await g(`${API}/files/${c.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})});cards=cards.filter(x=>x.id!==c.id);close();render();toast('Moved to Drive trash')}catch(e){toast('Could not delete — try again')}$('vYes').disabled=false};

$('q').oninput=render;$('filter').onchange=render;$('refresh').onclick=load;

readRedirect();
const saved=ls.get('gcv_tok');
if(saved&&saved.exp>Date.now()){
  token=saved.t;$('login').classList.add('hide');$('app').classList.remove('hide');$('add').classList.remove('hide');$('out').classList.remove('hide');
  fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()).then(j=>j.user&&ls.set('gcv_hint',j.user.emailAddress)).catch(()=>{});
  load();
}else needLogin(saved?'Session ended — tap Sign in (one tap).':'Not signed in.');
}
</script>
</body>
</html>
